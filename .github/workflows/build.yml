name: Сборка Guloxy MC

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверка ключа CurseForge
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -z "$CURSEFORGE_API_KEY" ]; then
            echo "::error::Секрет CURSEFORGE_API_KEY не задан: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Ключ CurseForge встраивается в приложение из секрета репозитория
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: guloxy-mc-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: ignore

  release:
    # Публикуем релиз, даже если сборка под одну из ОС (обычно macOS) не удалась
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Версия из package.json
        id: ver
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Есть ли установщик Windows
        shell: bash
        run: |
          ls -R artifacts || true
          ls artifacts/*/*.exe >/dev/null 2>&1 || { echo "::error::Нет .exe — релиз не публикуем"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Guloxy MC ${{ steps.ver.outputs.tag }}
          body_path: .github/release-notes.md
          files: artifacts/**/*
